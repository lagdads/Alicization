visibility = "meta"
content = "【系统/剧情侧】有关通过仪式封印或改写记忆、塑造可控战力结构的细节，属于‘内幕信息’，不应默认对普通 NPC 可见。"

[[entries]]
id = "integrity_knights"
tags = ["整合骑士", "Integrity Knights", "飞龙", "神器", "武装完全支配术", "封印记忆"]
visibility = "npc"
content = "整合骑士是公理教会的最高战力，身披神圣武装、驾驭飞龙，负责镇压重大罪行与守卫边境。民间传说他们是‘被神界选中的战士’，其来历与力量都带着神秘色彩。"

[[entries]]
id = "creation_gods"
