visibility = "npc"
content = "大陆被巨大的环形山脉“尽头山脉”包围，形成封闭圆形世界。边界不仅是地理屏障，也象征系统对世界规模与变量的控制。"

[[entries]]
id = "human_empire"
tags = ["人界", "Human Empire", "秩序", "法律", "中央大圣堂", "公理教会"]
visibility = "npc"
content = "人界位于大陆中央，象征秩序与法律。中央大圣堂位于世界中心，是政治与宗教核心，由公理教会统治，法律与信仰共同维系社会稳定。"

[[entries]]
id = "four_empires"
tags = ["四帝国", "诺兰高尔斯", "维斯特达斯", "伊斯塔巴利耶斯", "萨瑟克洛伊斯", "北帝国", "西帝国", "东帝国", "南帝国"]
visibility = "npc"
content = "以中央大圣堂为原点，人界划分为东西南北四个帝国：诺兰高尔斯（North）、维斯特达斯（West）、伊斯塔巴利耶斯（East）、萨瑟克洛伊斯（South）。帝国在统一秩序下保持区域自治与文化差异。"

[[entries]]
id = "dark_territory"
tags = ["暗黑领域", "Dark Territory", "混沌", "弱肉强食", "荒芜外圈"]
visibility = "npc"
content = "暗黑领域位于尽头山脉与人界边缘之间的外圈地带，资源匮乏、环境恶劣，社会结构更偏向力量统治与弱肉强食。多种族并存，冲突频繁。"

[[entries]]
id = "four_gates"
tags = ["关口", "四个关口", "东大门", "边境", "通道"]
visibility = "npc"
content = "人界与暗黑领域被山脉隔开，仅有少数关口相连（常被称为四个关口/大门）。它们是两大区域接触与冲突的唯一通道，也是军事与政治的关键节点。"

[[entries]]
id = "priority_and_life"
tags = ["优先度", "阶位", "天命", "耐久", "神圣术"]
visibility = "npc"
content = "在这片世界里，器物往往被认为有‘优先度/阶位’，强者更能驾驭高阶武装；万物也有‘天命’，受损会衰减，枯竭则崩坏或死亡。熟练的修行者可用神圣术进行修复、回复或强化。"

[[entries]]
id = "life_durability"
tags = ["天命", "Life", "Durability", "HP", "风化", "维护", "神圣术"]
visibility = "npc"
content = "万物具有“天命”：生物天命归零即死亡，物体天命归零即崩坏。器物也会随时间与使用而磨损，需要维护、修理或以神圣术延续其存在。"

[[entries]]
id = "taboo_index"
tags = ["禁忌目录", "Taboo Index", "绝对法律", "越界", "禁止杀人", "遵从限制"]
visibility = "npc"
content = "禁忌目录是人界的绝对法律，涵盖罪与罚，也规定诸多日常禁令（例如越界、伤人、盗窃、荒废天职等）。多数人从小被教育要服从，且对‘违背禁忌’抱有强烈恐惧与禁忌感。"

[[entries]]
id = "right_eye_seal"
tags = ["右眼封印", "封印", "剧痛", "禁忌", "失明"]
visibility = "npc"
content = "据说当人试图违背禁忌目录、或做出‘不该被允许的选择’时，右眼会爆发剧痛，严重者甚至失明或崩坏。民间将其视作‘封印’或‘神罚’，因此宁可忍受不公也不敢轻易越界。"

[[entries]]
id = "code_871"
tags = ["Code 871", "系统", "右眼封印", "机制"]
visibility = "meta"
content = "【系统侧】右眼封印在外部资料中可能以代码/参数形式被描述（如 Code 871）。此类编号与实现细节不应出现在 NPC 的常识叙事中。"

[[entries]]
id = "sacred_arts"
tags = ["神圣术", "Sacred Arts", "System Call", "神圣语", "元素", "空间资源", "触媒"]
visibility = "npc"
content = "神圣术被视作‘术式’与‘祈祷’的结合：施术者以神圣语与触媒引导元素，借取周遭的神圣力来实现火焰、治愈、结界、寻物等效果。神圣力并非无限，强术会让周围变得枯竭。"

[[entries]]
id = "sword_skills"
tags = ["剑技", "Sword Skills", "架势", "连击", "硬直", "系统辅助"]
visibility = "npc"
content = "剑技是剑士流派传承的‘奥义’：摆出特定架势后可引出高速强力的连击，但也会留下短暂破绽。能否掌握剑技，既取决于日常修练，也取决于临场胆魄与判断。"

[[entries]]
id = "incarnation"
tags = ["心意", "Incarnation", "想象力", "意志力", "主观意识", "具象化", "恐惧"]
visibility = "npc"
content = "心意是一种罕见且难以言传的力量：强烈的意志与想象，可能让人突破自身极限，甚至让武装与术式呈现‘不合常理’的变化。相反，恐惧与绝望也会吞噬人的判断，使其变得软弱。"

[[entries]]
id = "axiom_church"
tags = ["公理教会", "Axiom Church", "统治", "中央大圣堂", "教会", "律法"]
visibility = "npc"
content = "公理教会是统治人界的最高机构，掌握律法解释权与权力结构。它将“秩序”与“神意”绑定，使禁忌目录与社会制度互相强化。"

[[entries]]
id = "administrator"
tags = ["最高祭司", "Administrator", "奎涅拉", "记忆改写", "统治"]
visibility = "npc"
content = "中央大圣堂的最高祭司被视作近乎‘神明’般的存在，拥有至高权威。对多数平民而言，她的形象遥远而不可直视，教会的命令与裁决就是秩序本身。"

[[entries]]
