title = "Underworld（Alicization）世界观"
summary = "这片大陆被尽头山脉环绕，山外是无人能踏足的‘世界尽头’。山内分为人界与暗黑领域：人界以中央大圣堂与四帝国维系秩序，暗黑领域以力量为尊、种族杂居。世间万物皆有‘天命’，器物有‘优先度’，强者与修行者可通过神圣术与剑技改变战局；少数人能以‘心意’将意志化为现实。禁忌目录是人界的绝对法，背弃者将遭受右眼封印的惩罚。"

